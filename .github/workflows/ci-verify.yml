name: ci-verify

on:
  push:
    branches: ['arena/8dc93f02-collegeerp']

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, sqlite3, mbstring, xml, curl, bcmath, intl, zip, gd, fileinfo, dom
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build assets
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Prepare environment
        run: |
          mkdir -p /tmp/out
          cp .env.example .env
          php artisan key:generate --force
          php artisan config:clear

      - name: Registration workflow tests
        if: always()
        shell: bash
        run: |
          set -o pipefail
          php artisan test tests/Feature/Students/StudentRegistrationApprovalTest.php --colors=never 2>&1 | tee /tmp/out/registration.txt

      - name: Student import tests
        if: always()
        shell: bash
        run: |
          set -o pipefail
          php artisan test tests/Feature/Students/StudentImportTest.php --colors=never 2>&1 | tee /tmp/out/import.txt

      - name: Student module regression
        if: always()
        shell: bash
        run: |
          set -o pipefail
          php artisan test tests/Feature/Students --colors=never 2>&1 | tee /tmp/out/students.txt

      - name: Approval and gate regression
        if: always()
        shell: bash
        run: |
          set -o pipefail
          php artisan test tests/Feature/Approval/ApprovalManagementTest.php tests/Feature/Admissions/AdmissionConfirmationGateTest.php --colors=never 2>&1 | tee /tmp/out/approval.txt

      - name: Sidebar and conversion regression
        if: always()
        shell: bash
        run: |
          set -o pipefail
          php artisan test tests/Feature/Layout tests/Feature/AdmissionSidebarAndApprovalRegressionTest.php tests/Feature/Admissions/AdmissionToStudentConversionTest.php --colors=never 2>&1 | tee /tmp/out/sidebar.txt

      - name: Admission module regression
        if: always()
        shell: bash
        run: |
          set -o pipefail
          php artisan test tests/Feature/Admissions --colors=never 2>&1 | tee /tmp/out/admissions.txt

      - name: Full suite
        if: always() && contains(github.event.head_commit.message, '[full]')
        shell: bash
        run: |
          set -o pipefail
          php artisan test --colors=never 2>&1 | tee /tmp/out/full.txt

      - name: Publish raw output through the Checks API
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/check
          for f in $(find /tmp/out -maxdepth 1 -name '*.txt' | sort); do
            base=$(basename "$f" .txt)
            safe=$(echo "$base" | tr -c 'A-Za-z0-9_-' '-')
            if [ "$base" = "full" ]; then
              sed -r 's/\x1B\[[0-9;]*[mK]//g' "$f" | tail -n 900 > "/tmp/check/${safe}.raw"
            else
              sed -r 's/\x1B\[[0-9;]*[mK]//g' "$f" > "/tmp/check/${safe}.raw"
            fi
            {
              echo "PHPUnit output file: ${base}.txt"
              grep -E '^[[:space:]]*(PASS|FAIL|Tests:|Duration:|FAILED)' "/tmp/check/${safe}.raw" | head -n 40
              echo '----- failure summaries -----'
              grep -n -E -A 18 -B 2 'FAILED |Failed asserting|Expected response status|The following exception|syntax error' "/tmp/check/${safe}.raw" | head -n 500
              echo '----- tail (failure detail and summary) -----'
              tail -c 40000 "/tmp/check/${safe}.raw"
            } > "/tmp/check/${safe}.txt"
            head -c 60000 "/tmp/check/${safe}.txt" > "/tmp/check/${safe}.final"
            mv "/tmp/check/${safe}.final" "/tmp/check/${safe}.txt"
            jq -n \
              --arg name "phpunit-${safe}-${GITHUB_RUN_ID}" \
              --arg sha "$GITHUB_SHA" \
              --arg title "PHPUnit ${base} output for ${GITHUB_SHA}" \
              --arg summary "Raw ${base} test output." \
              --rawfile text "/tmp/check/${safe}.txt" \
              '{name:$name, head_sha:$sha, status:"completed", conclusion:"neutral", output:{title:$title, summary:$summary, text:$text}}' \
              > "/tmp/check/${safe}.json"
            gh api "repos/${GITHUB_REPOSITORY}/check-runs" --method POST --input "/tmp/check/${safe}.json" > "/tmp/check/${safe}-response.json"
            echo "Published check run phpunit-${safe}-${GITHUB_RUN_ID}"
          done
