name: ci-verify

on:
  push:
    branches: ['**']

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, sqlite3, mbstring, xml, curl, bcmath, intl, zip
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build assets
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Focused Finance / Fees tests
        if: always()
        run: |
          mkdir -p /tmp/out
          php artisan test tests/Feature/Finance 2>&1 | tee /tmp/out/focused.txt
          echo "focused=${PIPESTATUS[0]}" > /tmp/out/focused.exit

      - name: Navigation and seeder regression tests
        if: always()
        run: |
          php artisan test \
            tests/Feature/Results/ResultNavigationTest.php \
            tests/Feature/Examinations/ExaminationsNavigationTest.php \
            tests/Feature/Marksheets/MarksheetsTest.php \
            tests/Feature/Students/StudentProfileTabsTest.php \
            tests/Feature/Examinations/ExaminationsModuleSeederTest.php \
            tests/Feature/Students/StudentModuleSeederTest.php \
            tests/Feature/Audit 2>&1 | tee /tmp/out/regression.txt
          echo "regression=${PIPESTATUS[0]}" > /tmp/out/regression.exit

      - name: Complete suite
        if: always()
        run: |
          php artisan test 2>&1 | tee /tmp/out/all.txt
          echo "all=${PIPESTATUS[0]}" > /tmp/out/all.exit

      - name: Publish raw output to results branch
        if: always()
        env:
          TOKEN: ${{ github.token }}
          RESULTS_BRANCH: ci-results/run-${{ github.run_id }}
        run: |
          cd /tmp/out
          git init -q
          git config user.email "ci@users.noreply.github.com"
          git config user.name "ci"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/yashubharat2-ops/collegeerp.git"
          git add -A
          git commit -qm "phpunit output" || true
          git push -f origin "HEAD:refs/heads/${RESULTS_BRANCH}" -q
          echo "results published to ${RESULTS_BRANCH}"

      - name: Fail if any suite failed
        if: always()
        run: |
          ec=0
          grep -qx "focused=0" /tmp/out/focused.exit || ec=1
          grep -qx "regression=0" /tmp/out/regression.exit || ec=1
          grep -qx "all=0" /tmp/out/all.exit || ec=1
          echo "focused=$(cat /tmp/out/focused.exit) regression=$(cat /tmp/out/regression.exit) all=$(cat /tmp/out/all.exit)"
          [ "$ec" -eq 0 ] || { echo "::error::at least one test suite failed"; exit 1; }
