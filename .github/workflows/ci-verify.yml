name: ci-verify

on:
  push:
    branches: ['arena/8dc93f02-collegeerp']

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, sqlite3, mbstring, xml, curl, bcmath, intl, zip, gd, fileinfo, dom
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build assets
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Prepare environment
        run: |
          mkdir -p /tmp/out
          cp .env.example .env
          php artisan key:generate --force
          php artisan config:clear

      - name: AdmissionApplicationAuthorizationTest
        if: always()
        shell: bash
        run: |
          set -o pipefail
          php artisan test tests/Feature/Admissions/AdmissionApplicationAuthorizationTest.php --colors=never 2>&1 | tee /tmp/out/auth.txt

      - name: AdmissionApplicationManagementTest
        if: always()
        shell: bash
        run: |
          set -o pipefail
          php artisan test tests/Feature/Admissions/AdmissionApplicationManagementTest.php --colors=never 2>&1 | tee /tmp/out/management.txt

      - name: AdmissionToStudentConversionTest
        if: always()
        shell: bash
        run: |
          set -o pipefail
          php artisan test tests/Feature/Admissions/AdmissionToStudentConversionTest.php --colors=never 2>&1 | tee /tmp/out/conversion.txt

      - name: AdmissionWorkflowTest
        if: always()
        shell: bash
        run: |
          set -o pipefail
          php artisan test tests/Feature/Admissions/AdmissionWorkflowTest.php --colors=never 2>&1 | tee /tmp/out/workflow.txt

      - name: SidebarRailTooltipTest
        if: always()
        shell: bash
        run: |
          set -o pipefail
          php artisan test tests/Feature/Layout/SidebarRailTooltipTest.php --colors=never 2>&1 | tee /tmp/out/tooltip.txt

      - name: AdmissionConfirmationGateTest (must stay green)
        if: always()
        shell: bash
        run: |
          set -o pipefail
          php artisan test tests/Feature/Admissions/AdmissionConfirmationGateTest.php --colors=never 2>&1 | tee /tmp/out/gate.txt

      - name: AdmissionManagementTest (must stay green)
        if: always()
        shell: bash
        run: |
          set -o pipefail
          php artisan test tests/Feature/Admissions/AdmissionManagementTest.php --colors=never 2>&1 | tee /tmp/out/admission-management.txt

      - name: ApprovalManagementTest (must stay green)
        if: always()
        shell: bash
        run: |
          set -o pipefail
          php artisan test tests/Feature/Approval/ApprovalManagementTest.php --colors=never 2>&1 | tee /tmp/out/approval.txt

      - name: SidebarStructureTest and navigation regression
        if: always()
        shell: bash
        run: |
          set -o pipefail
          php artisan test tests/Feature/Layout/SidebarStructureTest.php tests/Feature/AdmissionSidebarAndApprovalRegressionTest.php --colors=never 2>&1 | tee /tmp/out/sidebar.txt

      - name: Full suite
        if: always() && contains(github.event.head_commit.message, '[full]')
        shell: bash
        run: |
          set -o pipefail
          php artisan test --colors=never 2>&1 | tee /tmp/out/full.txt

      - name: Publish raw output through the Checks API
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/check
          for f in $(find /tmp/out -maxdepth 1 -name '*.txt' | sort); do
            base=$(basename "$f" .txt)
            safe=$(echo "$base" | tr -c 'A-Za-z0-9_-' '-')
            if [ "$base" = "full" ]; then
              sed -r 's/\x1B\[[0-9;]*[mK]//g' "$f" | tail -n 900 > "/tmp/check/${safe}.raw"
            else
              sed -r 's/\x1B\[[0-9;]*[mK]//g' "$f" > "/tmp/check/${safe}.raw"
            fi
            {
              echo "PHPUnit output file: ${base}.txt"
              grep -E '^[[:space:]]*(PASS|FAIL|Tests:|Duration:|FAILED)' "/tmp/check/${safe}.raw" | head -n 40
              echo '----- tail (failure detail and summary) -----'
              tail -c 50000 "/tmp/check/${safe}.raw"
            } > "/tmp/check/${safe}.txt"
            head -c 60000 "/tmp/check/${safe}.txt" > "/tmp/check/${safe}.final"
            mv "/tmp/check/${safe}.final" "/tmp/check/${safe}.txt"
            jq -n \
              --arg name "phpunit-${safe}-${GITHUB_RUN_ID}" \
              --arg sha "$GITHUB_SHA" \
              --arg title "PHPUnit ${base} output for ${GITHUB_SHA}" \
              --arg summary "Raw ${base} test output for PR #80 failure analysis." \
              --rawfile text "/tmp/check/${safe}.txt" \
              '{name:$name, head_sha:$sha, status:"completed", conclusion:"neutral", output:{title:$title, summary:$summary, text:$text}}' \
              > "/tmp/check/${safe}.json"
            gh api "repos/${GITHUB_REPOSITORY}/check-runs" --method POST --input "/tmp/check/${safe}.json" > "/tmp/check/${safe}-response.json"
            echo "Published check run phpunit-${safe}-${GITHUB_RUN_ID}"
          done

      - name: Upload raw test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-output
          path: /tmp/out
          if-no-files-found: warn
