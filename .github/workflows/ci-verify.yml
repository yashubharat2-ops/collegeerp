name: ci-verify

on:
  push:
    branches: ['arena/8dc93f02-collegeerp']

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, sqlite3, mbstring, xml, curl, bcmath, intl, zip, gd, fileinfo, dom
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build assets
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Prepare environment
        run: |
          mkdir -p /tmp/out
          cp .env.example .env
          php artisan key:generate --force
          php artisan config:clear

      - name: AdmissionApplicationAuthorizationTest
        if: always()
        shell: bash
        run: |
          set -o pipefail
          php artisan test tests/Feature/Admissions/AdmissionApplicationAuthorizationTest.php --colors=never 2>&1 | tee /tmp/out/auth.txt

      - name: AdmissionApplicationManagementTest
        if: always()
        shell: bash
        run: |
          set -o pipefail
          php artisan test tests/Feature/Admissions/AdmissionApplicationManagementTest.php --colors=never 2>&1 | tee /tmp/out/management.txt

      - name: AdmissionToStudentConversionTest
        if: always()
        shell: bash
        run: |
          set -o pipefail
          php artisan test tests/Feature/Admissions/AdmissionToStudentConversionTest.php --colors=never 2>&1 | tee /tmp/out/conversion.txt

      - name: AdmissionWorkflowTest
        if: always()
        shell: bash
        run: |
          set -o pipefail
          php artisan test tests/Feature/Admissions/AdmissionWorkflowTest.php --colors=never 2>&1 | tee /tmp/out/workflow.txt

      - name: SidebarRailTooltipTest
        if: always()
        shell: bash
        run: |
          set -o pipefail
          php artisan test tests/Feature/Layout/SidebarRailTooltipTest.php --colors=never 2>&1 | tee /tmp/out/tooltip.txt

      - name: AdmissionConfirmationGateTest (must stay green)
        if: always()
        shell: bash
        run: |
          set -o pipefail
          php artisan test tests/Feature/Admissions/AdmissionConfirmationGateTest.php --colors=never 2>&1 | tee /tmp/out/gate.txt

      - name: AdmissionManagementTest (must stay green)
        if: always()
        shell: bash
        run: |
          set -o pipefail
          php artisan test tests/Feature/Admissions/AdmissionManagementTest.php --colors=never 2>&1 | tee /tmp/out/admission-management.txt

      - name: ApprovalManagementTest (must stay green)
        if: always()
        shell: bash
        run: |
          set -o pipefail
          php artisan test tests/Feature/Approval/ApprovalManagementTest.php --colors=never 2>&1 | tee /tmp/out/approval.txt

      - name: SidebarStructureTest and navigation regression
        if: always()
        shell: bash
        run: |
          set -o pipefail
          php artisan test tests/Feature/Layout/SidebarStructureTest.php tests/Feature/AdmissionSidebarAndApprovalRegressionTest.php --colors=never 2>&1 | tee /tmp/out/sidebar.txt

      - name: Full suite
        if: always() && contains(github.event.head_commit.message, '[full]')
        shell: bash
        run: |
          set -o pipefail
          php artisan test --colors=never 2>&1 | tee /tmp/out/full.txt

      - name: Publish raw output through the Checks API
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/check
          {
            echo "GitHub run: ${GITHUB_RUN_ID}"
            echo "Commit: ${GITHUB_SHA}"
            for f in $(find /tmp/out -maxdepth 1 -name '*.txt' ! -name 'full.txt' | sort); do
              echo
              echo "===== $(basename "$f") ====="
              sed -r 's/\x1B\[[0-9;]*[mK]//g' "$f" | tail -n 60
            done
          } > /tmp/check/focused.raw
          head -c 60000 /tmp/check/focused.raw > /tmp/check/focused.txt

          jq -n \
            --arg name "phpunit-focused-${GITHUB_RUN_ID}" \
            --arg sha "$GITHUB_SHA" \
            --arg title "Focused PHPUnit output for ${GITHUB_SHA}" \
            --arg summary "Focused test output for PR #80 failure analysis." \
            --rawfile text /tmp/check/focused.txt \
            '{name:$name, head_sha:$sha, status:"completed", conclusion:"neutral", output:{title:$title, summary:$summary, text:$text}}' \
            > /tmp/check/focused.json
          gh api "repos/${GITHUB_REPOSITORY}/check-runs" --method POST --input /tmp/check/focused.json > /tmp/check/focused-response.json

          if [ -f /tmp/out/full.txt ]; then
            {
              echo "GitHub run: ${GITHUB_RUN_ID}"
              echo "Commit: ${GITHUB_SHA}"
              echo "===== full.txt ====="
              sed -r 's/\x1B\[[0-9;]*[mK]//g' /tmp/out/full.txt | tail -n 500
            } > /tmp/check/full.raw
            head -c 60000 /tmp/check/full.raw > /tmp/check/full.txt
            jq -n \
              --arg name "phpunit-full-${GITHUB_RUN_ID}" \
              --arg sha "$GITHUB_SHA" \
              --arg title "Full PHPUnit output for ${GITHUB_SHA}" \
              --arg summary "Full-suite test output for PR #80 failure analysis." \
              --rawfile text /tmp/check/full.txt \
              '{name:$name, head_sha:$sha, status:"completed", conclusion:"neutral", output:{title:$title, summary:$summary, text:$text}}' \
              > /tmp/check/full.json
            gh api "repos/${GITHUB_REPOSITORY}/check-runs" --method POST --input /tmp/check/full.json > /tmp/check/full-response.json
          fi
          echo "Published focused output; full output present: $([ -f /tmp/out/full.txt ] && echo yes || echo no)"

      - name: Upload raw test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-output
          path: /tmp/out
          if-no-files-found: warn
